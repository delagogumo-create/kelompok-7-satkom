  <!-- AREA UTAMA -->

    <!-- HEADER -->

        aria-label="Buka atau tutup menu"

          <line x1="4" y1="17" x2="18" y2="17"/>
        </svg>

      </button>

      <!-- PROFIL PIMPINAN -->
      <div class="profile-wrap">

        <button class="profile" id="userBtn" type="button"
          aria-haspopup="true" aria-expanded="false">

          <span>Pimpinan</span>

          <span class="avatar">

              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>

          </span>

        </button>

        <!-- DROPDOWN PROFIL -->
        <div class="dropdown" id="dropdown" role="menu" hidden>

          <a href="edit-profil.html" role="menuitem">
            <svg class="i" viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-4.4 3.6-7 8-7"/>
              <path d="m16 19 2 2 4-4"/>
            </svg>
            <span>Edit Profil</span>

            <svg class="i" viewBox="0 0 24 24">

              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.7 1.7-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21h-2.4v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-1.7-1.7.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H7v-2.4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06 1.7-1.7.06.06a1.65 1.65 0 0 0 1.82.33 1.65 1.65 0 0 0 1-1.51V7h2.4v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 1.7 1.7-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21v2.4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>

        </div>

    <!-- KONTEN -->
    <section class="content">

      <div class="page-head">
        <h1>Analisis Pimpinan</h1>
        <p>
          Perbandingan konsumsi dan efisiensi energi per ruangan,
          Oktober 2026
        </p>
      </div>

      <!-- GRAFIK -->
      <div class="card chart-card">

        <div class="card-head">
          <h2>Perbandingan Listrik (bulan ini)</h2>
          <span>Pemakaian listrik (kWh)</span>
        </div>

        <div class="chart-shell">
          <div class="chart" id="chart">
            <div class="grid" id="grid"></div>
            <div class="bars" id="bars"></div>
          </div>

          <div class="xlabels" id="xlabels"></div>
        </div>

      </div>

      <!-- TABEL -->
      <div class="card table-card">

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>N. Ruangan</th>
                <th>Jml<br>AC</th>
                <th>Jml<br>Lampu</th>
                <th>kWh</th>
                <th>RASIO</th>
              </tr>
            </thead>

            <tbody id="rows"></tbody>
          </table>
        </div>

      </div>

      <!-- PAGINATION -->
      <div class="pagination">
        <button class="pagebtn" id="back" type="button">
          Back
        </button>

        <span id="pageCount">1 / 1</span>

        <button class="pagebtn" id="next" type="button">
          Next
        </button>
      </div>

    </section>
  </main>
</div>

<!-- NOTIFIKASI -->
<div class="notice" id="notice"></div>

<script>
/* DATA ANALISIS */
const sample = [
  {id:1, room:'Kelas', ac:8, lamps:3, kwh:800, ratio:53.3},
  {id:2, room:'L. Komputer', ac:28, lamps:10, kwh:200, ratio:40.0},
  {id:3, room:'R. Dosen', ac:13, lamps:6, kwh:150, ratio:18.8},
  {id:4, room:'R. T.U', ac:11, lamps:7, kwh:120, ratio:19.7},
  {id:5, room:'R. Seminar', ac:6, lamps:8, kwh:950, ratio:31.7},
  {id:6, room:'Perpustakaan', ac:10, lamps:12, kwh:1050, ratio:28.4},
  {id:7, room:'Laboratorium', ac:5, lamps:6, kwh:1300, ratio:35.2}
];

let data;

try {
  data = JSON.parse(
    localStorage.getItem('analisis-pimpinan-listrik')
  ) || sample;
} catch (error) {
  data = sample;
}

let page = 1;
const perPage = 4;

const $ = id => document.getElementById(id);


/* NOTIFIKASI */
function notify(message) {
  const notice = $('notice');

  notice.textContent = message;
  notice.style.display = 'block';

  clearTimeout(window.noticeTimer);

  window.noticeTimer = setTimeout(() => {
    notice.style.display = 'none';
  }, 2500);
}


/* TAMPILKAN TABEL */
function render() {
  const pages = Math.max(
    1,
    Math.ceil(data.length / perPage)
  );

  if (page > pages) {
    page = pages;
  }

  const shown = data.slice(
    (page - 1) * perPage,
    page * perPage
  );

  $('rows').innerHTML = shown.length
    ? shown.map((room, index) => `
        <tr>
          <td>${(page - 1) * perPage + index + 1}</td>
          <td>${room.room}</td>
          <td>${room.ac}</td>
          <td>${room.lamps}</td>
          <td>${Number(room.kwh).toLocaleString('id-ID')}</td>
          <td>${Number(room.ratio).toFixed(1)}</td>
        </tr>
      `).join('')
    : `
        <tr>
          <td colspan="6" class="empty">
            Belum ada data analisis.
          </td>
        </tr>
      `;

  $('pageCount').textContent = `${page} / ${pages}`;

  $('back').disabled = page <= 1;
  $('next').disabled = page >= pages;

  renderChart();
}


/* TAMPILKAN GRAFIK */
function renderChart() {
  const values = data.slice(0, 7);

  const highest = Math.max(
    ...values.map(room => Number(room.kwh)),
    0
  );

  const max = Math.max(
    500,
    Math.ceil(highest / 500) * 500
  );

  const step = 500;

  /* GARIS DAN ANGKA GRAFIK */
  let grid = '';

  for (let value = max; value >= 0; value -= step) {
    const position = (value / max) * 100;

    const line = document.createElement('div');
    line.className = 'gline';
    line.style.setProperty('--line-position', `${position}%`);

    const label = document.createElement('span');
    label.textContent = value.toLocaleString('id-ID');

    line.appendChild(label);
    grid += line.outerHTML;
  }

  $('grid').innerHTML = grid;


  /* BATANG GRAFIK */
  $('bars').innerHTML = values.map(room => {
    const height = Math.max(
      1,
      Number(room.kwh) / max * 100
    );

    return `
      <div class="bar-col"
           title="${room.room}: ${room.kwh} kWh">

        <span class="val"
              style="--bar-height:${height}%">
          ${Number(room.kwh).toLocaleString('id-ID')}
        </span>

        <div class="bar" style="height:${height}%"></div>

      </div>
    `;
  }).join('');


  /* NAMA RUANGAN */
  $('xlabels').innerHTML = values.map(room => `
    <span title="${room.room}">
      ${room.room}
    </span>
  `).join('');
}


/* PAGINATION */
$('back').addEventListener('click', function() {
  if (page > 1) {
    page--;
    render();
  }
});

$('next').addEventListener('click', function() {
  const pages = Math.ceil(data.length / perPage);

  if (page < pages) {
    page++;
    render();
  }
});


/* HAMBURGER SIDEBAR */
$('hamb').addEventListener('click', function() {
  const collapsed = $('sidebar').classList.toggle('collapsed');

  $('hamb').setAttribute(
    'aria-expanded',
    collapsed ? 'false' : 'true'
  );
});


/* DROPDOWN PROFIL */
const dropdown = $('dropdown');
const userBtn = $('userBtn');

userBtn.addEventListener('click', function(event) {
  event.stopPropagation();

  dropdown.hidden = !dropdown.hidden;

  userBtn.setAttribute(
    'aria-expanded',
    dropdown.hidden ? 'false' : 'true'
  );
});

document.addEventListener('click', function(event) {
  if (
    !dropdown.contains(event.target) &&
    !userBtn.contains(event.target)
  ) {
    dropdown.hidden = true;
    userBtn.setAttribute('aria-expanded', 'false');
  }
});

document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') {
    dropdown.hidden = true;
    userBtn.setAttribute('aria-expanded', 'false');
  }
});


/* TOMBOL KELUAR */
$('logout').addEventListener('click', function(event) {
  event.preventDefault();

  notify('Versi demo: belum terhubung ke sistem login.');
});


/* JALANKAN HALAMAN */
render();
</script>

</body>
